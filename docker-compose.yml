services:
  postgres:
    image: postgres:16-alpine
    container_name: kms-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: knowledge_management_system
    ports:
      - '5435:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: kms-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - '9007:9000'
      - '9008:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 3s
      timeout: 3s
      retries: 5

  create-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadminpassword;
      /usr/bin/mc mb myminio/knowledge-management-system --ignore-existing;
      /usr/bin/mc anonymous set download myminio/knowledge-management-system;
      exit 0;
      "

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: kms-backend
    restart: always
    ports:
      - '3010:3000'
    environment:
      PORT: '3000'
      NODE_ENV: 'production'
      DATABASE_URL: 'postgresql://postgres:postgrespassword@postgres:5432/knowledge_management_system?schema=public'
      AWS_REGION: 'us-east-1'
      AWS_S3_BUCKET: 'knowledge-management-system'
      AWS_ACCESS_KEY_ID: 'minioadmin'
      AWS_SECRET_ACCESS_KEY: 'minioadminpassword'
      AWS_S3_ENDPOINT: 'http://minio:9000'
      AWS_S3_FORCE_PATH_STYLE: 'true'
      GEMINI_API_KEY: '${GEMINI_API_KEY}'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: kms-frontend
    restart: always
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
