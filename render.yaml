services:
  # ==========================================
  # Frontend Web Service (Nginx React SPA)
  # ==========================================
  - type: web
    name: kms-frontend
    env: docker
    dockerfilePath: ./apps/frontend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon

  # ==========================================
  # Backend API Service (Express + Prisma)
  # ==========================================
  - type: web
    name: kms-backend
    env: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kms-postgres
          property: connectionString
      - key: PORT
        value: 3000
      - key: S3_ENDPOINT
        value: http://kms-minio:9000
      - key: S3_BUCKET_NAME
        value: kms-assets
      - key: AWS_ACCESS_KEY_ID
        value: minioadmin
      - key: AWS_SECRET_ACCESS_KEY
        value: minioadmin
      - key: AWS_S3_FORCE_PATH_STYLE
        value: "true"
      - key: GEMINI_API_KEY
        sync: false

  # ==========================================
  # MinIO S3 Storage Container Service
  # ==========================================
  - type: web
    name: kms-minio
    env: image
    image:
      url: docker.io/minio/minio:latest
    dockerCommand: server /data --console-address ":9001"
    plan: free
    region: oregon
    envVars:
      - key: MINIO_ROOT_USER
        value: minioadmin
      - key: MINIO_ROOT_PASSWORD
        value: minioadmin

# ==========================================
# Managed PostgreSQL Database
# ==========================================
databases:
  - name: kms-postgres
    plan: free
    region: oregon
    databaseName: knowledge_management_system
    user: kms_user
