services:
  # ==========================================
  # 1. Backend API Service (Express + Prisma)
  # ==========================================
  - type: web
    name: kms-backend
    env: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kms-postgres
          property: connectionString
      - key: PORT
        value: 8080
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_FORCE_PATH_STYLE
        value: "true"
      - key: GEMINI_API_KEY
        sync: false

  # ==========================================
  # 2. Frontend Web Service (Nginx React SPA)
  #    Direct API communication via VITE_API_BASE_URL
  # ==========================================
  - type: web
    name: kms-frontend
    env: docker
    dockerfilePath: ./apps/frontend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: kms-backend
          property: url

# ==========================================
# Managed PostgreSQL Database
# ==========================================
databases:
  - name: kms-postgres
    plan: free
    region: oregon
    databaseName: knowledge_management_system
    user: kms_user
